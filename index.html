<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوت‌نامه تولد 🎀</title>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(135deg, #fdf6ec 0%, #f7e7d3 50%, #f0d9bf 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 20px;
        }

        /* ===== کارت دعوت ===== */
        .card {
            position: relative;
            background: #fffaf3;
            border: 3px solid #8b1e3f;
            border-radius: 28px;
            padding: 40px 30px 35px;
            max-width: 430px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(139, 30, 63, 0.25),
                inset 0 0 0 8px #fdf6ec,
                inset 0 0 0 11px #8b1e3f33;
            z-index: 5;
            animation: cardIn 1.2s ease-out;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* نوار بالای کارت */
        .card::before {
            content: "";
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 6px;
            border-radius: 10px;
            background: #8b1e3f;
            opacity: 0.7;
        }

        .emoji-row {
            font-size: 42px;
            letter-spacing: 12px;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .title {
            font-size: 30px;
            font-weight: 900;
            color: #8b1e3f;
            margin-bottom: 6px;
            text-shadow: 1px 1px 0 #f0d9bf;
        }

        .subtitle {
            font-size: 15px;
            color: #a56a4e;
            margin-bottom: 22px;
        }

        .divider {
            width: 80%;
            height: 2px;
            margin: 0 auto 22px;
            background: linear-gradient(to left, transparent, #8b1e3f, transparent);
        }

        .name {
            font-size: 34px;
            font-weight: 900;
            color: #8b1e3f;
            margin: 6px 0 4px;
            letter-spacing: 1px;
        }

        .age {
            font-size: 20px;
            font-weight: 700;
            color: #a56a4e;
            margin-bottom: 20px;
        }

        .details {
            font-size: 16px;
            line-height: 2.1;
            color: #5c3a2e;
            margin-bottom: 20px;
        }

        .details b {
            color: #8b1e3f;
        }

        .decor {
            font-size: 34px;
            letter-spacing: 10px;
            margin-top: 10px;
        }

        .footer-note {
            font-size: 13px;
            color: #b08d7a;
            margin-top: 18px;
            font-style: italic;
        }

        /* ===== کاغذهای رنگی ===== */
        .confetti {
            position: fixed;
            top: -20px;
            width: 12px;
            height: 18px;
            opacity: 0.95;
            z-index: 1;
            pointer-events: none;
            border-radius: 2px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0.8;
            }
        }

        /* دکمه پخش موزیک */
        .music-btn {
            position: fixed;
            bottom: 18px;
            left: 18px;
            z-index: 20;
            background: #8b1e3f;
            color: #fffaf3;
            border: none;
            border-radius: 50px;
            padding: 10px 18px;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(139, 30, 63, 0.4);
            transition: transform 0.2s;
        }

        .music-btn:hover {
            transform: scale(1.06);
        }

        @media (max-width: 420px) {
            .card {
                padding: 30px 18px 25px;
            }

            .title {
                font-size: 24px;
            }

            .name {
                font-size: 28px;
            }

            .details {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- دکمه پخش موزیک -->
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵 پخش موزیک</button>

    <!-- کارت دعوت -->
    <div class="card">
        <div class="emoji-row">🎀 🧸 🎂</div>

        <h1 class="title">دعوت‌نامه‌ی تولد</h1>
        <p class="subtitle">با کلی ذوق و شوق منتظرت هستیم!</p>

        <div class="divider"></div>

        <p class="name">🌸 آوین 🌸</p>
        <p class="age">🎉 ۸ ساله می‌شود! 🎉</p>

        <div class="details">
            <p>📅 <b>تاریخ:</b> پنجشنبه 30 مهر</p>
            <p>🕓 <b>ساعت:</b> 16 الی 20</p>
            <p>📍 <b>مکان:</b> خانه جشن نارسی</p>
        </div>

        <div class="divider"></div>

        <div class="decor">🎈 🎂 🧸 🎀 🎁</div>

        <p class="footer-note">حضورت جشن ما را قشنگ‌تر می‌کند 💖</p>
    </div>

    <!-- موزیک -->
    <audio id="bdayMusic" loop>
        <source src="./sub_clair-happy-birthday-579516.mp3" type="audio/mpeg">
    </audio>

    <script>
        /* ===== ساخت کاغذهای رنگی ===== */
        const colors = ['#8b1e3f', '#c94b6b', '#f2c9a8', '#f7e7d3', '#d4a373', '#a56a4e', '#e8b4b8'];
        const body = document.body;

        function createConfetti() {
            const piece = document.createElement('div');
            piece.classList.add('confetti');

            const size = Math.random() * 8 + 8;
            piece.style.width = size + 'px';
            piece.style.height = (size * 1.5) + 'px';
            piece.style.left = Math.random() * 100 + 'vw';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.animationDuration = (Math.random() * 4 + 4) + 's';
            piece.style.animationDelay = (Math.random() * 5) + 's';

            if (Math.random() > 0.6) {
                piece.style.borderRadius = '50%';
            }

            body.appendChild(piece);
        }

        for (let i = 0; i < 45; i++) {
            createConfetti();
        }

        /* ===== پخش موزیک ===== */
        const music = document.getElementById('bdayMusic');
        const btn = document.getElementById('musicBtn');

        function toggleMusic() {
            if (music.paused) {
                music.play();
                btn.textContent = '⏸ توقف موزیک';
            } else {
                music.pause();
                btn.textContent = '🎵 پخش موزیک';
            }
        }

        /* تلاش برای پخش خودکار هنگام باز شدن صفحه */
        window.addEventListener('load', () => {
            music.volume = 0.4;
            music.play().then(() => {
                btn.textContent = '⏸ توقف موزیک';
            }).catch(() => {
                /* اگر مرورگر اجازه نداد، با کلیک کاربر پخش می‌شود */
                btn.textContent = '🎵 پخش موزیک';
            });
        });
    </script>

</body>

</html>
