<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Birthday Invitation 🎀</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            /* ارتفاع دقیق روی موبایل، حتی با نوار آدرس */
            overflow: hidden;
            background-color: #fdf6ec;
            /* فقط رنگ پشتیبان، دیده نمی‌شه */
        }

        body {
            background-image: url('./photo_5945081460861636460_w.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* روی موبایل: cover با مرکز تصویر */
        @media (max-width: 768px) {
            body {
                background-size: cover;
                background-position: center center;
                background-attachment: scroll;
                /* iOS با fixed مشکل داره */
            }
        }

        /* دکمه پخش موزیک */
        .music-btn {
            position: fixed;
            bottom: 18px;
            left: 18px;
            z-index: 20;
            background: #8b1e3f;
            color: #fffaf3;
            border: none;
            border-radius: 50px;
            padding: 10px 18px;
            font-family: Tahoma, sans-serif;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(139, 30, 63, 0.4);
            transition: transform 0.2s;
            opacity: 0.85;
        }

        .music-btn:hover {
            transform: scale(1.06);
            opacity: 1;
        }
    </style>
</head>

<body>

    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵 Play Music</button>

    <audio id="bdayMusic" loop>
        <source src="./sub_clair-happy-birthday-579516.mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('bdayMusic');
        const btn = document.getElementById('musicBtn');

        function toggleMusic() {
            if (music.paused) {
                music.play();
                btn.textContent = '⏸ Pause Music';
            } else {
                music.pause();
                btn.textContent = '🎵 Play Music';
            }
        }

        window.addEventListener('load', () => {
            music.volume = 0.4;
            music.play().then(() => {
                btn.textContent = '⏸ Pause Music';
            }).catch(() => {
                btn.textContent = '🎵 Play Music';
            });
        });
    </script>

</body>

</html>
